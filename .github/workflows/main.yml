name: CI
on: push

jobs:
  lint:
    name: Lint with PSScriptAnalyzer
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # Invoke-Lint.ps1 installs PSScriptAnalyzer itself and applies the rules from
      # PSScriptAnalyzerSettings.psd1, so running it locally gives the same result as here.
      - name: Lint with PSScriptAnalyzer
        shell: pwsh
        run: ./Invoke-Lint.ps1 -FailOn Error
  report:
    name: Run reporting script
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Run reporting script
        shell: powershell
        run: .\Report.ps1
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: Report
          path: Reports
          if-no-files-found: error
